spring.application.name=junara
# spring.profiles.active is intentionally not set here.
# The active profile is controlled at runtime via the JVM argument
# -Dspring.profiles.active=prod (set in Dockerfile ENTRYPOINT).
# Setting it here would override that argument and load the wrong profile.

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Security
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${SECURITY_PASSWORD:admin123}

# Session Configuration
server.servlet.session.timeout=30m

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.org.springframework.security=WARN

