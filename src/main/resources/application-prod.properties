spring.application.name=junara

# PostgreSQL Configuration
# Railway injeta automaticamente: PGHOST, PGPORT, PGUSER, PGPASSWORD, PGDATABASE
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server
server.port=${PORT:8080}

# H2 Console - desabilitado em producao
spring.h2.console.enabled=false

# CORS - defina os dominios permitidos
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://junaradeliveryjava-production.up.railway.app,https://*.github.io}

# Admin usuario inicial
app.admin.password=${ADMIN_PASSWORD:admin123}

# Logging
logging.level.root=WARN
logging.level.com.junaradelivery=INFO

# Upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Session
server.servlet.session.timeout=30m
