spring.application.name=junara

# H2 Database Configuration (File-based - persiste dados entre reinicializações)
spring.datasource.url=jdbc:h2:file:./data/junaradb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# CORS - adicione origens permitidas separadas por vírgula
app.cors.allowed-origins=http://localhost:8081,https://faddy-nonenvious-myla.ngrok-free.dev

# H2 Console (para visualizar dados)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.root=INFO
logging.level.com.junaradelivery=DEBUG
