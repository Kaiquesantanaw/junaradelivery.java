name: Deploy Shop to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "src/main/resources/templates/shop.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BACKEND_URL: https://junaradeliveryjava-production.up.railway.app

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        shell: bash
        env:
          BACKEND_URL: ${{ env.BACKEND_URL }}
        run: |
          mkdir -p _site
          cp src/main/resources/templates/shop.html _site/index.html
          # Ajusta links/URLs para execução estática no GitHub Pages.
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          page = Path("_site/index.html")
          html = page.read_text(encoding="utf-8")
          backend_url = os.environ["BACKEND_URL"]

          html = html.replace(
              '<a href="/">Dashboard</a>',
              f'<a href="{backend_url}/admin" target="_blank" rel="noopener">Dashboard</a>',
          )
          html = html.replace('<a href="/shop">Cardápio</a>', '<a href="./">Cardápio</a>')
          html = re.sub(
              r'<form class="logout" th:action="@\{/logout\}" method="post">\s*<button type="submit">Sair</button>\s*</form>',
              f'<a href="{backend_url}/admin" target="_blank" rel="noopener">Admin</a>',
              html,
          )
          html = html.replace(
              '</head>',
              f'    <script>window.__JUNARA_API_BASE_URL__ = "{backend_url}";</script>\n</head>',
          )

          page.write_text(html, encoding="utf-8")
          PY
          # Evita processamento pelo Jekyll e garante publicação exata dos arquivos estáticos.
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
