name: Deploy Shop to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "src/main/resources/templates/shop.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p _site
          cp src/main/resources/templates/shop.html _site/index.html
          python - <<'PY'
          from pathlib import Path

          page = Path("_site/index.html")
          html = page.read_text(encoding="utf-8")

          html = html.replace(
              '<a href="/">Dashboard</a>',
              '<a href="https://junaradeliveryjava-production.up.railway.app/admin" target="_blank" rel="noopener">Dashboard</a>',
          )
          html = html.replace('<a href="/shop">Cardápio</a>', '<a href="./">Cardápio</a>')
          html = html.replace(
              '<form class="logout" th:action="@{/logout}" method="post">\n            <button type="submit">Sair</button>\n        </form>',
              '<a href="https://junaradeliveryjava-production.up.railway.app/admin" target="_blank" rel="noopener">Admin</a>',
          )

          page.write_text(html, encoding="utf-8")
          PY
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
